name: CodeBuild Runner Test

on:
  workflow_dispatch:      # cho phép chạy thủ công từ tab Actions
  push:
    branches: [doduc]

jobs:
  test-build:
    name: Test Build on CodeBuild Runner
    runs-on:
      - codebuild-devsecops-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner info ==="
          echo "Hostname: $(hostname)"
          uname -a
          echo "=== Tools ==="
          docker --version
          git --version
          node --version || true
          aws --version || true

      - name: List repository files
        run: ls -la

      - name: Test Docker build
        run: |
          echo "=== Building root Dockerfile ==="
          docker build -t devsecops-test:${{ github.sha }} .
          echo "=== BUILD OK ==="
          docker images | head -5
