name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # de upload ket qua Trivy (SARIF) len GitHub Security tab

jobs:
  # ============ BACKEND: build + smoke test + trivy scan ============
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: node --check server.js

      - name: Smoke test - start server & check endpoints
        working-directory: backend
        env:
          PORT: '3000'
        run: |
          node server.js &
          SERVER_PID=$!
          
          # Doi server khoi dong (toi da 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 1
          done
          
          echo "--- GET /health ---"
          HEALTH=$(curl -sf http://localhost:3000/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || { echo "Health check failed"; kill $SERVER_PID; exit 1; }
          
          echo "--- GET /api/info ---"
          INFO=$(curl -sf http://localhost:3000/api/info)
          echo "$INFO"
          echo "$INFO" | grep -q '"hostname"' || { echo "/api/info failed"; kill $SERVER_PID; exit 1; }
          
          kill $SERVER_PID
          echo "Backend smoke test PASSED"

      - name: Build backend Docker image
        run: docker build -t backend:ci ./backend

      - name: Trivy scan backend image (generate SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:ci
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          vuln-type: os,library

      - name: Upload backend scan report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif
          if-no-files-found: ignore

      - name: Upload backend scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif

      - name: Trivy scan backend image (display table report)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: backend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  # ============ FRONTEND: build + test nginx container + trivy scan ============
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate nginx config
        # --add-host để nginx -t resolve được hostname "backend" (trong compose thì hostname này tồn tại sẵn)
        run: docker run --rm --add-host backend:127.0.0.1 -v $PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine nginx -t

      - name: Build frontend Docker image
        run: docker build -t frontend:ci ./frontend

      - name: Smoke test - run container & check index.html
        run: |
          docker run -d --name frontend-test --add-host backend:127.0.0.1 -p 8080:80 frontend:ci
          
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Frontend is up after ${i}s"
              break
            fi
            sleep 1
          done
          
          echo "--- GET / (index.html) ---"
          HTML=$(curl -sf http://localhost:8080)
          echo "$HTML" | head -n 20
          
          if echo "$HTML" | grep -qi '<html'; then
            echo "Frontend smoke test PASSED"
          else
            echo "index.html did not return expected HTML content"
            docker logs frontend-test
            docker rm -f frontend-test
            exit 1
          fi
          
          docker rm -f frontend-test

      - name: Trivy scan frontend image (generate SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          vuln-type: os,library

      - name: Upload frontend scan report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-frontend-sarif
          path: trivy-frontend.sarif
          if-no-files-found: ignore

      - name: Upload frontend scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-frontend.sarif

      - name: Trivy scan frontend image (display table report)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: frontend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  # ============ INTEGRATION: full stack voi docker compose ============
  integration:
    name: Integration Test (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & start full stack (db + backend + frontend)
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          # Doi frontend (proxy) san sang, toi da 60s
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Stack is up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Stack failed to start"
              docker compose logs
              exit 1
            fi
            sleep 1
          done

      - name: Test endpoints through nginx proxy
        run: |
          set -e
          
          echo "--- GET / (frontend) ---"
          curl -sf http://localhost:8080 | grep -qi '<html' || { echo "Frontend failed"; exit 1; }
          
          echo "--- GET /api/info (proxy -> backend) ---"
          curl -sf http://localhost:8080/api/info | grep -q '"hostname"' || { echo "/api/info failed"; exit 1; }
          
          echo "--- GET /health (backend) ---"
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"' || { echo "/health failed"; exit 1; }
          
          echo "--- POST /api/items (ghi DB) ---"
          curl -sf -X POST http://localhost:8080/api/items \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-test-item"}' | grep -q '"ok":true' || { echo "POST /api/items failed"; exit 1; }
          
          echo "--- GET /api/items (doc DB) ---"
          curl -sf http://localhost:8080/api/items | grep -q 'ci-test-item' || { echo "GET /api/items failed"; exit 1; }
          
          echo "--- GET /api/search?q=ci (WAF demo) ---"
          curl -sf 'http://localhost:8080/api/search?q=ci' | grep -q 'ci-test-item' || { echo "/api/search failed"; exit 1; }
          
          echo "Integration test PASSED"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v

