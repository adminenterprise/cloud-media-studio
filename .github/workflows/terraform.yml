name: "Terraform DevSecOps CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Bắt buộc để xin OIDC JWT token từ GitHub
  contents: read  # Bắt buộc để checkout code repo

jobs:
  terraform-ci:
    name: "Terraform Plan & Security Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Zero Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586643076560:role/github-action
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Build Lambda Deployment Artifacts
        working-directory: .
        run: |
          npm --prefix backend/lambda/image_processor install --os=linux --cpu=arm64 --include=optional
          (cd backend/lambda/image_processor && zip -qr ../../../terraform/lambda_payload.zip index.js package.json node_modules)
          (cd backend/lambda/media_api && zip -qr ../../../terraform/lambda_api_payload.zip index.js)

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (S3 Remote Backend)
        run: |
          cp terraform.tfvars.example terraform.tfvars
          terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -lock=false
