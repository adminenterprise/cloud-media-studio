name: "Terraform DevSecOps CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Bắt buộc để xin OIDC JWT token từ GitHub
  contents: read  # Bắt buộc để checkout code repo

jobs:
  terraform-ci:
    name: "Terraform Plan & Security Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS Credentials (OIDC - Zero Secret Keys)
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::586643076560:role/github-action
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Build Lambda Deployment Artifacts (Cross-Arch ARM64)
        working-directory: ${{ github.workspace }}
        run: |
          npm --prefix backend/lambda/image_processor install --os=linux --cpu=arm64 --libc=glibc --include=optional --force --no-audit --no-fund
          (cd backend/lambda/image_processor && zip -qr "${{ github.workspace }}/terraform/lambda_payload.zip" index.js package.json node_modules)
          (cd backend/lambda/media_api && zip -qr "${{ github.workspace }}/terraform/lambda_api_payload.zip" index.js)
          ls -lh "${{ github.workspace }}/terraform/lambda_payload.zip" "${{ github.workspace }}/terraform/lambda_api_payload.zip"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init & Validate (Local Backend Fallback for PR without AWS Auth)
        if: steps.aws-auth.outcome != 'success'
        run: |
          echo "::warning ::AWS OIDC credentials not available for this event (PR trust policy). Running offline validation."
          terraform init -backend=false
          terraform validate

      - name: Terraform Init (S3 Remote Backend)
        if: steps.aws-auth.outcome == 'success'
        run: |
          cp terraform.tfvars.example terraform.tfvars
          terraform init

      - name: Terraform Validate
        if: steps.aws-auth.outcome == 'success'
        run: terraform validate

      - name: Terraform Plan
        if: steps.aws-auth.outcome == 'success'
        run: terraform plan -no-color -lock=false
