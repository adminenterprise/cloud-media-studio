name: Deploy Frontend to CloudFront & S3

on:
  push:
    branches:
      - main
      - mquan
    paths:
      - 'frontend/**'
      - 'index.html'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Yêu cầu để xin JWT token OIDC từ GitHub (Zero Secret Keys)
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ========================================================================
      # BƯỚC 1: npm install
      # ========================================================================
      - name: 1. npm install
        run: npm install

      # ========================================================================
      # BƯỚC 2: npm run build (Tạo Build Artifacts dist/)
      # ========================================================================
      - name: 2. npm run build
        run: npm run build

      # ========================================================================
      # BƯỚC XÁC THỰC OIDC VỚI AWS (Zero Static Secret Keys)
      # ========================================================================
      - name: Configure AWS Credentials (OIDC - Zero Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586643076560:role/github-action
          aws-region: ap-southeast-1

      # ========================================================================
      # BƯỚC 3: AWS S3 Sync (Đẩy file từ dist/ lên S3 Bucket)
      # ========================================================================
      - name: 3. AWS S3 Sync
        run: |
          echo "Syncing dist/ to S3 bucket cloud-media-studio-assets-586643076560..."
          # 1. Upload index.html với no-cache để người dùng luôn nhận bản mới nhất
          aws s3 cp dist/index.html s3://cloud-media-studio-assets-586643076560/index.html \
            --content-type "text/html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"
          
          # 2. Sync các static assets còn lại (nếu có) với cache 1 năm tại Edge (Bảo vệ thư mục uploads/ không bị xóa)
          aws s3 sync dist/ s3://cloud-media-studio-assets-586643076560/ \
            --exclude "index.html" \
            --exclude "uploads/*" \
            --cache-control "public,max-age=31536000,immutable"

      # ========================================================================
      # BƯỚC 4: CloudFront Invalidation (Làm mới Cache CDN trên Edge)
      # ========================================================================
      - name: 4. CloudFront Origin Invalidation
        run: |
          echo "Creating CloudFront Invalidation for Distribution E23QIJLQ2A8EEN..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E23QIJLQ2A8EEN \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation created with ID: $INVALIDATION_ID"

      - name: 5. Deployment Summary
        run: |
          echo "=========================================================="
          echo "🎉 CI/CD PIPELINE THÀNH CÔNG!"
          echo "🌐 CloudFront Live URL: https://d10b9bys5mn60c.cloudfront.net"
          echo "=========================================================="

