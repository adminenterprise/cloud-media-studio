<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo 3-Tier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#fff; --ink:#14213d; --muted:#5b6b86; --line:#d7deea;
  --accent:#2a5bff; --accent-ink:#fff; --ok:#1e9e6a; --bad:#d64545; --panel:#14213d; --panel-ink:#f3f6fb;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);padding:clamp(16px,4vw,48px)}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:clamp(1.6rem,3.5vw,2.25rem);font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px;max-width:60ch}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.server{background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:24px;position:sticky;top:24px}
@media (max-width:820px){.server{position:static}}
.status{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot[data-state=down]{background:var(--bad)}
.label{color:#9fb0cf;font-size:.875rem;margin:22px 0 2px}
.host{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800;letter-spacing:.02em;word-break:break-all;line-height:1.15}
.server[data-state=down] .host{opacity:.4}
.host.changed{animation:swap .9s ease-out}
@keyframes swap{0%{color:#ffd166;transform:translateY(-4px)}100%{color:inherit;transform:none}}
.note{min-height:1.5em;color:#ffd166;font-size:.9rem;margin:6px 0 0}
.latency{color:#9fb0cf;font-size:.9rem;margin-top:2px}
.seen{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.seen li{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;font-size:.85rem}
.seen b{font-weight:800;margin-left:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
h2{font-size:1.1rem;margin:0 0 14px}
.row{display:flex;gap:10px;margin-bottom:12px}
@media (max-width:480px){.row{flex-direction:column}}
label{display:block;font-size:.875rem;font-weight:600;margin-bottom:4px}
input{flex:1;min-width:0;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid #8fa8ff;outline-offset:2px}
.field{flex:1}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0}
#list{list-style:none;margin:0;padding:0}
#list li{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
#list li:last-child{border-bottom:0}
#list .id{color:var(--muted);font-size:.875rem}
.empty,.error{padding:16px 4px;color:var(--muted)}
.error{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.host.changed{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ENTERPRISE CLOUD DEVSECOPS PLATFORM</h1>

  <div class="grid">
    <aside class="server" id="server" data-state="up" aria-live="polite">
      <div class="status"><span class="dot" id="dot" data-state="up"></span><span id="state">Đang kết nối…</span></div>
      <p class="label">Máy chủ đang phục vụ</p>
      <div class="host" id="host">…</div>
      <p class="note" id="note"></p>
      <p class="latency" id="ms"></p>
      <p class="label">Các máy chủ đã trả lời trong phiên này</p>
      <ul class="seen" id="seen"></ul>
    </aside>

    <main class="card">
      <h2>Thêm item mới</h2>
      <form class="row" id="add-form">
        <div class="field">
          <label for="name">Tên item</label>
          <input id="name" required maxlength="255" autocomplete="off" placeholder="Ví dụ: Máy chủ web 01">
        </div>
        <button type="submit" style="align-self:flex-end">Thêm item</button>
      </form>

      <hr class="divider">

      <h2>Danh sách item</h2>
      <label for="search">Tìm theo tên</label>
      <input id="search" type="search" autocomplete="off" placeholder="Nhập để tìm…" style="width:100%;margin-bottom:8px">
      <ul id="list"></ul>
    </main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

const seen = new Map();
let current = null;

function renderSeen() {
  $('seen').replaceChildren(...[...seen].map(([h, n]) => {
    const li = document.createElement('li');
    li.textContent = h;
    const b = document.createElement('b');
    b.textContent = n;
    li.append(b);
    return li;
  }));
}

async function poll() {
  const t0 = performance.now();
  try {
    const { hostname } = await api('/api/info');
    $('server').dataset.state = $('dot').dataset.state = 'up';
    $('state').textContent = 'Đang hoạt động';
    $('host').textContent = hostname;
    $('ms').textContent = 'Phản hồi trong ' + Math.round(performance.now() - t0) + ' ms';
    if (current && current !== hostname) {
      $('note').textContent = 'Đã chuyển sang máy chủ khác.';
      const h = $('host'); h.classList.remove('changed'); void h.offsetWidth; h.classList.add('changed');
    }
    current = hostname;
    seen.set(hostname, (seen.get(hostname) || 0) + 1);
    renderSeen();
  } catch {
    $('server').dataset.state = $('dot').dataset.state = 'down';
    $('state').textContent = 'Mất kết nối, đang thử lại…';
    $('ms').textContent = '';
  }
}

function message(cls, text) {
  const li = document.createElement('li');
  li.className = cls; li.textContent = text;
  return li;
}

async function loadItems() {
  const q = $('search').value.trim();
  try {
    const rows = await api(q ? '/api/search?q=' + encodeURIComponent(q) : '/api/items');
    if (!rows.length) {
      $('list').replaceChildren(message('empty', q ? 'Không có item nào khớp với "' + q + '".' : 'Chưa có item nào. Thêm item đầu tiên ở phía trên.'));
      return;
    }
    $('list').replaceChildren(...rows.map(r => {
      const li = document.createElement('li');
      const name = document.createElement('span'); name.textContent = r.name;
      const id = document.createElement('span'); id.className = 'id'; id.textContent = '#' + r.id;
      li.append(name, id);
      return li;
    }));
  } catch {
    $('list').replaceChildren(message('error', 'Không tải được danh sách. Kiểm tra container backend rồi thử lại.'));
  }
}

$('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) return;
  try {
    await api('/api/items', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    $('name').value = '';
    $('search').value = '';
    loadItems();
  } catch {
    $('list').replaceChildren(message('error', 'Không thêm được item. Kiểm tra container backend rồi thử lại.'));
  }
});

let timer;
$('search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadItems, 250); });

poll(); setInterval(poll, 2000);
loadItems();
</script>
</body>
</html>
