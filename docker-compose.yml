services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uapp -papppass -e 'SELECT 1 FROM items LIMIT 1;' appdb"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
  backend:
    build: ./backend
    environment: { DB_HOST: db, DB_USER: app, DB_PASSWORD: apppass, DB_NAME: appdb }
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]